<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="login-icon">🖥️</div>

      <h1>EdHardwareShop</h1>

      <p>Entre na sua conta para continuar.</p>
    </div>

    <form>
      <div class="form-group">
        <label for="email"> E-mail </label>

        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Digite seu e-mail"
        />
      </div>

      <div class="form-group">
        <label for="password"> Senha </label>

        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Digite sua senha"
        />
      </div>

      <div class="role-section">
        <h2>Entrar como</h2>

        <div class="role-options">
          <button
            type="button"
            class="role-option"
            [class.selected]="role === 'cliente'"
            (click)="role = 'cliente'"
          >
            <span class="role-icon"> 👤 </span>

            <span> Cliente </span>
          </button>

          <button
            type="button"
            class="role-option"
            [class.selected]="role === 'admin'"
            (click)="role = 'admin'"
          >
            <span class="role-icon"> 🛠️ </span>

            <span> Administrador </span>
          </button>
        </div>
      </div>

      @if(errorMessage) {

      <p class="error-message">{{ errorMessage }}</p>

      }

      <button type="button" class="login-button" (click)="login()">Entrar</button>

      <button type="button" class="register-button" (click)="goToRegister()">
        Criar uma conta
      </button>
    </form>

    <button type="button" class="back-button" (click)="backToHome()">Voltar para a loja</button>
  </div>
</div>
