<div class="admin-product-container">
  <div class="admin-product-card">
    <div class="page-header">
      <div>
        <span class="admin-label"> PAINEL ADMINISTRATIVO </span>

        <h1>{{ isEditing ? 'Editar produto' : 'Adicionar produto' }}</h1>

        <p>
          {{ isEditing ? 'Edite as informações do produto da EdHardwareShop.' : 'Cadastre um novo
          produto na EdHardwareShop.' }}
        </p>
      </div>

      <button type="button" class="back-button" (click)="cancel()">Voltar</button>
    </div>

    <form class="product-form" (ngSubmit)="saveProduct()">
      <div class="form-group">
        <label for="name"> Nome do produto </label>

        <input
          id="name"
          type="text"
          [(ngModel)]="product.name"
          name="name"
          placeholder="Digite o nome do produto"
          required
        />
      </div>

      <div class="form-group">
        <label for="description"> Descrição </label>

        <textarea
          id="description"
          [(ngModel)]="product.description"
          name="description"
          placeholder="Digite a descrição do produto"
          rows="4"
          required
        >
        </textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="price"> Preço </label>

          <input
            id="price"
            type="number"
            [(ngModel)]="product.price"
            name="price"
            min="0"
            step="0.01"
            required
          />
        </div>

        <div class="form-group">
          <label for="stock"> Estoque </label>

          <input
            id="stock"
            type="number"
            [(ngModel)]="product.stock"
            name="stock"
            min="0"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="category"> Categoria </label>

        <input
          id="category"
          type="text"
          [(ngModel)]="product.category"
          name="category"
          placeholder="Ex: Placa de Vídeo"
          required
        />
      </div>

      <!-- IMAGEM -->

      <div class="form-group">
        <span class="form-label"> Imagem do produto </span>

        <label
          class="image-drop-zone"
          [class.has-image]="imagePreview"
          (dragover)="onDragOver($event)"
          (drop)="onDrop($event)"
        >
          @if (!imagePreview) {

          <div class="upload-content">
            <div class="upload-icon">🖼️</div>

            <strong> Arraste uma imagem aqui </strong>

            <span> ou clique para escolher uma imagem do computador </span>

            <small> PNG, JPG, JPEG ou WEBP </small>
          </div>

          } @else {

          <div class="image-preview">
            <img [src]="imagePreview" alt="Prévia do produto" />

            <span> Clique ou arraste outra imagem para substituir </span>
          </div>

          }

          <input type="file" accept="image/*" (change)="onFileSelected($event)" />
        </label>
      </div>

      <div class="form-actions">
        <button type="button" class="cancel-button" (click)="cancel()">Cancelar</button>

        <button type="submit" class="save-button">
          {{ isEditing ? 'Salvar alterações' : 'Adicionar produto' }}
        </button>
      </div>
    </form>
  </div>
</div>
